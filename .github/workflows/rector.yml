name: Rector PHP 8.3 Upgrade

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  rector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run Rector (PHP 8.3)
        run: composer rector

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(rector): apply PHP 8.3 upgrades'
          branch: ${{ github.head_ref || github.ref_name }}
